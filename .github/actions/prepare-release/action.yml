name: Prepare Release
description: Plan, validate, and open a Rigkit release PR.

inputs:
  release-type:
    description: "patch, minor, or major"
    required: true
  release-version:
    description: "The selected release version"
    required: true
  github-token:
    description: "GitHub token used to open the release PR"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Check release bot token permissions
      shell: bash
      env:
        RELEASE_BOT_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bun scripts/release/check-github-token.ts

    - name: Configure release bot token
      shell: bash
      env:
        RELEASE_BOT_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        if [ -z "$RELEASE_BOT_TOKEN" ]; then
          echo "Missing RELEASE_BOT_TOKEN secret. Prepare release workflows need a token with permission to push workflow file updates." >&2
          exit 1
        fi

        git config --local --unset-all http.https://github.com/.extraheader || true
        git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        registry-url: "https://registry.npmjs.org"

    - name: Setup pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.15.9 --activate

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Plan release
      id: plan
      shell: bash
      run: |
        pnpm release:plan -- \
          --release-type "${{ inputs.release-type }}" \
          --expected-version "${{ inputs.release-version }}"

    - name: Create release branch
      if: steps.plan.outputs.create_release_branch == 'true'
      shell: bash
      env:
        TARGET_BRANCH: ${{ steps.plan.outputs.target_branch }}
      run: |
        remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
        head_sha="$(git rev-parse HEAD)"

        if [ -n "$remote_sha" ]; then
          if [ "$remote_sha" != "$head_sha" ]; then
            echo "${TARGET_BRANCH} already exists at ${remote_sha}, expected ${head_sha}." >&2
            echo "Use Prepare Patch Release from that branch, or delete/recreate the branch intentionally." >&2
            exit 1
          fi

          echo "${TARGET_BRANCH} already exists at the current commit; reusing it."
          exit 0
        fi

        git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

    - name: Create automation branch
      id: branch
      shell: bash
      env:
        VERSION: ${{ steps.plan.outputs.version }}
      run: |
        branch="automation/release-v${VERSION}-${GITHUB_RUN_ID}"
        git switch -c "$branch"
        echo "branch=$branch" >> "$GITHUB_OUTPUT"

    - name: Apply version bump
      shell: bash
      run: pnpm release:bump -- "${{ steps.plan.outputs.version }}"

    - name: Update docs release version
      shell: bash
      run: pnpm docs:version -- --version "${{ steps.plan.outputs.version }}"

    - name: Validate release
      shell: bash
      run: pnpm release:preflight -- --allow-unpublished

    - name: Validate docs links
      shell: bash
      run: pnpm docs:broken-links

    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Test
      shell: bash
      run: pnpm test

    - name: Build
      shell: bash
      run: pnpm build

    - name: Commit version bump
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        if git diff --quiet; then
          echo "No release changes were generated" >&2
          exit 1
        fi

        git add .
        git commit -m "Prepare Rigkit v${{ steps.plan.outputs.version }}"
        git push --set-upstream origin "${{ steps.branch.outputs.branch }}"

    - name: Open release PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET_BRANCH: ${{ steps.plan.outputs.target_branch }}
        HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
        VERSION: ${{ steps.plan.outputs.version }}
        RELEASE_TYPE: ${{ steps.plan.outputs.release_type }}
        CURRENT_VERSION: ${{ steps.plan.outputs.current_version }}
      run: |
        body="$RUNNER_TEMP/release-pr.md"
        {
          echo "Prepares Rigkit v${VERSION}."
          echo ""
          echo "- Current version: ${CURRENT_VERSION}"
          echo "- Target branch: ${TARGET_BRANCH}"
          echo "- Release type: ${RELEASE_TYPE}"
          echo "- Docs metadata: apps/docs/docs.json"
          echo ""
          echo "Merging this PR will create tag v${VERSION}. The tag will trigger npm publishing and the CLI release."
        } > "$body"

        gh pr create \
          --base "$TARGET_BRANCH" \
          --head "$HEAD_BRANCH" \
          --title "Release Rigkit v${VERSION}" \
          --body-file "$body"
