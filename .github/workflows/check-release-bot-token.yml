name: Check Release Bot Token

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/actions/prepare-release/action.yml"
      - ".github/workflows/check-release-bot-token.yml"
      - ".github/workflows/prepare-major-release.yml"
      - ".github/workflows/prepare-minor-release.yml"
      - ".github/workflows/prepare-patch-release.yml"
      - ".github/workflows/tag-release.yml"
      - "scripts/release/check-github-token.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  check-release-bot-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check release bot token permissions
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/release/check-github-token.ts
