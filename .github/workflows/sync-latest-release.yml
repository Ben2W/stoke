name: Sync Latest Release To Main

on:
  workflow_run:
    workflows:
      - Publish npm Packages
      - Release CLI
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to sync, for example v0.2.1"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-latest-release-${{ github.event.workflow_run.head_branch || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  sync-latest-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check release bot token permissions
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/release/check-github-token.ts

      - name: Check release workflows
        id: release-workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not a stable release tag; skipping main sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for workflow in publish-npm.yml release-cli.yml; do
            count="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --event push \
                --limit 20 \
                --json headBranch,status,conclusion \
                --jq "map(select(.headBranch == \"$TAG\" and .status == \"completed\" and .conclusion == \"success\")) | length"
            )"

            if [ "$count" = "0" ]; then
              echo "${workflow} has not succeeded for ${TAG}; skipping for now."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Plan main sync
        if: steps.release-workflows.outputs.ready == 'true'
        id: plan
        env:
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: bun scripts/release/sync-latest-release.ts --tag "$TAG"

      - name: Configure release bot git auth
        if: steps.plan.outputs.should_sync == 'true'
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Create sync branch
        if: steps.plan.outputs.should_sync == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          SYNC_BRANCH: ${{ steps.plan.outputs.sync_branch }}
        run: |
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          git fetch origin "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}"; then
            git switch -c "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
            git merge --no-edit origin/main
          else
            git switch -c "$SYNC_BRANCH" origin/main
          fi

          git merge --no-edit "origin/${RELEASE_BRANCH}"
          git push --set-upstream origin "$SYNC_BRANCH"

      - name: Open sync PR
        if: steps.plan.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.plan.outputs.release_branch }}
          RELEASE_LINE: ${{ steps.plan.outputs.release_line }}
          SYNC_BRANCH: ${{ steps.plan.outputs.sync_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          existing_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // ""'
          )"

          if [ -n "$existing_url" ]; then
            echo "Sync PR already exists: ${existing_url}"
            exit 0
          fi

          body="$RUNNER_TEMP/sync-release-pr.md"
          {
            echo "Syncs ${RELEASE_BRANCH} back to main after ${TAG}."
            echo ""
            echo "- Released version: ${VERSION}"
            echo "- Release line: ${RELEASE_LINE}"
            echo "- Source branch: ${RELEASE_BRANCH}"
            echo ""
            echo "This keeps main aligned with the latest released line. Older release lines do not sync back automatically."
          } > "$body"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "Sync ${RELEASE_BRANCH} back to main" \
            --body-file "$body" \
            --label release:none
