name: Check Release Label

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  check-release-label:
    runs-on: ubuntu-latest

    steps:
      - name: Check release label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep '^release:' || true)"
          count="$(printf '%s\n' "$labels" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$count" != "1" ]; then
            echo "PRs into main must have exactly one release label: release:none, release:patch, release:minor, or release:major" >&2
            printf 'Found release labels:\n%s\n' "${labels:-<none>}" >&2
            exit 1
          fi

          case "$labels" in
            release:none|release:patch|release:minor|release:major)
              ;;
            *)
              echo "Unsupported release label: $labels" >&2
              exit 1
              ;;
          esac

          echo "label=$labels" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        if: steps.label.outputs.label != 'release:none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')"

          notes="$(printf '%s\n' "$body" | awk '
            BEGIN { in_section = 0 }
            /^##[[:space:]]+Release notes[[:space:]]*$/ { in_section = 1; next }
            /^##[[:space:]]/ { in_section = 0 }
            in_section { print }
          ')"

          stripped="$(printf '%s\n' "$notes" | sed -E '/^[[:space:]]*$/d; /^[[:space:]]*<!--/,/-->[[:space:]]*$/d')"

          if [ -z "$stripped" ]; then
            echo "PRs targeting main must fill in the '## Release notes' section in the PR description (or use the release:none label for chore-only PRs)." >&2
            exit 1
          fi

          printf 'Release notes:\n%s\n' "$stripped"
