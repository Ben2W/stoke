name: Canary Main

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: canary-main
  cancel-in-progress: false

jobs:
  canary-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute canary version
        id: canary
        run: pnpm release:canary-main-version -- --sha "$GITHUB_SHA"

      - name: Apply canary version
        run: pnpm release:bump -- "${{ steps.canary.outputs.version }}"

      - name: Canary preflight
        run: pnpm release:preflight -- --skip-release-branch --allow-unpublished

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack packages
        run: pnpm release:pack

      - name: Dry run canary publish
        run: pnpm release:publish -- --dry-run --tag canary

      - name: Publish canary packages
        run: pnpm release:publish -- --tag canary

      - name: Build CLI binaries
        run: pnpm build:cli-binaries

      - name: Smoke test Linux binary
        run: |
          ./dist/release/rig-linux-x64 --version
          ./dist/release/rig-linux-x64 help

      - name: Create canary GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          tag="${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Canary release ${tag} already exists" >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/release/*.tar.gz \
            dist/release/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease \
            --notes "Canary build from main @ ${GITHUB_SHA}"
