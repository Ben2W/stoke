name: Canary Main

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: canary-main
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.canary.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute canary version
        id: canary
        run: bun scripts/release/canary-main-version.ts --sha "${{ steps.sha.outputs.sha }}"

  publish:
    needs: compute-version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit
    with:
      version: ${{ needs.compute-version.outputs.version }}
      dist-tag: canary
      ref: main
      allow-unpublished: true
      skip-release-branch: true

  release-cli:
    needs: [compute-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canary version
        run: pnpm release:bump -- "${{ needs.compute-version.outputs.version }}"

      - name: Build
        run: pnpm build

      - name: Build CLI binaries
        run: pnpm build:cli-binaries

      - name: Smoke test Linux binary
        run: |
          ./dist/release/rig-linux-x64 --version
          ./dist/release/rig-linux-x64 help

      - name: Create canary GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          TARGET_SHA: ${{ needs.compute-version.outputs.sha }}
        run: |
          tag="${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Canary release ${tag} already exists" >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/release/*.tar.gz \
            dist/release/checksums.txt \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --prerelease \
            --notes "Canary build from main @ ${TARGET_SHA}"
