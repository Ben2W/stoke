name: Tag Release

on:
  pull_request:
    branches:
      - "release/**"
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: tag-release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'automation/release-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        run: pnpm release:preflight

      - name: Check release bot token permissions
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/release/check-github-token.ts

      - name: Create release tag
        id: tag
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(pnpm --silent release:version)"
          tag="v${version}"

          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists" >&2
            exit 1
          fi

          if [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo "Missing RELEASE_BOT_TOKEN secret" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Comment on release PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh pr comment "$PR_NUMBER" --body "Created release tag ${TAG}. npm publishing and CLI release workflows are now running."
