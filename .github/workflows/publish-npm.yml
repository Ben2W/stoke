name: Publish npm Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release versions
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="$(node -p "require('./packages/fdev-cli/package.json').version")"
            export GITHUB_REF_NAME="v${version}"
          fi
          pnpm release:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack packages
        run: |
          mkdir -p dist/npm
          pnpm -C packages/fdev-sdk pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-engine pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-cli pack --pack-destination ../../dist/npm

      - name: Dry run package publish
        run: |
          npx npm@latest publish dist/npm/freestyle-fdev-sdk-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-fdev-engine-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-fdev-cli-*.tgz --access public --dry-run

      - name: Publish packages
        run: |
          npx npm@latest publish dist/npm/freestyle-fdev-sdk-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-fdev-engine-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-fdev-cli-*.tgz --access public
