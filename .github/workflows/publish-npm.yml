name: Publish npm Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode (canary-main publishes 0.0.0-canary-* from main)"
        required: false
        default: canary-main
        type: choice
        options:
          - canary-main
  issue_comment:
    types:
      - created

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-npm-${{ github.event_name }}-${{ github.event.issue.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-stable:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release preflight
        run: pnpm release:preflight -- --allow-unpublished
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Pack packages
        run: pnpm release:pack
      - name: Dry run package publish
        run: pnpm release:publish -- --dry-run
      - name: Publish packages
        run: pnpm release:publish

  publish-canary-main:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.canary.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compute canary version
        id: canary
        run: bun scripts/release/canary-main-version.ts --sha "${{ github.sha }}"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canary version
        run: pnpm release:bump -- "${{ steps.canary.outputs.version }}"
      - name: Canary preflight
        run: pnpm release:preflight -- --skip-release-branch --allow-unpublished
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Pack packages
        run: pnpm release:pack
      - name: Dry run canary publish
        run: pnpm release:publish -- --dry-run --tag canary
      - name: Publish canary packages
        run: pnpm release:publish -- --tag canary

  canary-main-cli-release:
    needs: publish-canary-main
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish-canary-main.outputs.sha }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canary version
        run: pnpm release:bump -- "${{ needs.publish-canary-main.outputs.version }}"
      - name: Build
        run: pnpm build
      - name: Build CLI binaries
        run: pnpm build:cli-binaries
      - name: Smoke test Linux binary
        run: |
          ./dist/release/rig-linux-x64 --version
          ./dist/release/rig-linux-x64 help
      - name: Create canary GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ needs.publish-canary-main.outputs.version }}
          TARGET_SHA: ${{ needs.publish-canary-main.outputs.sha }}
        run: |
          tag="${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Canary release ${tag} already exists" >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/release/*.tar.gz \
            dist/release/checksums.txt \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --prerelease \
            --notes "Canary build from main @ ${TARGET_SHA}"

  publish-pr-canary:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/rigkit canary')
    runs-on: ubuntu-latest
    steps:
      - name: Verify command permissions
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "${ACTOR} must have write access to publish canaries" >&2
              exit 1
              ;;
          esac
      - name: Read PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --json headRefOid,headRepositoryOwner,headRepository)"
          sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          owner="$(printf '%s' "$pr_json" | jq -r '.headRepositoryOwner.login')"
          repo="$(printf '%s' "$pr_json" | jq -r '.headRepository.name')"
          if [ "${owner}/${repo}" != "$REPOSITORY" ]; then
            echo "Canary publishing is only allowed for branches in ${REPOSITORY}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compute PR canary version
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release/canary-version.ts \
            --pr "${{ steps.pr.outputs.pr_number }}" \
            --sha "${{ steps.pr.outputs.sha }}"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canary version
        run: pnpm release:bump -- "${{ steps.canary.outputs.version }}"
      - name: Canary preflight
        run: pnpm release:preflight -- --skip-release-branch --allow-unpublished
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Pack packages
        run: pnpm release:pack
      - name: Dry run canary publish
        run: pnpm release:publish -- --dry-run --tag "pr-${{ steps.pr.outputs.pr_number }}"
      - name: Publish canary packages
        run: pnpm release:publish -- --tag "pr-${{ steps.pr.outputs.pr_number }}"
      - name: Comment with canary version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "Published Rigkit canary packages at version ${VERSION} with npm dist-tag pr-${PR_NUMBER}."
