name: Publish npm Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release versions
        run: pnpm release:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check npm bootstrap status
        id: bootstrap
        run: |
          packages=(
            @freestyle-sh/fdev-engine
            @freestyle-sh/fdev-runtime-client
            @freestyle-sh/fdev
            @freestyle-sh/fdev-provider-freestyle
            @freestyle-sh/fdev-provider-gcloud
            @freestyle-sh/fdev-cmux
            @freestyle-sh/fdev-vscode
            @freestyle-sh/fdev-cli
          )
          missing=()
          for pkg in "${packages[@]}"; do
            if ! npm view "$pkg" name >/dev/null 2>&1; then
              missing+=("$pkg")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm packages do not exist yet (${missing[*]}); run the one-time Bootstrap npm Packages workflow first"
          fi

      - name: Pack packages
        if: steps.bootstrap.outputs.published == 'true'
        run: |
          mkdir -p dist/npm
          pnpm -C packages/fdev-engine pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-runtime-client pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-provider-freestyle pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-provider-gcloud pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-cmux pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-vscode pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-cli pack --pack-destination ../../dist/npm

      - name: Dry run package publish
        if: steps.bootstrap.outputs.published == 'true'
        run: |
          version="$(bun -p 'require("./packages/fdev/package.json").version')"
          npx npm@latest publish dist/npm/freestyle-sh-fdev-engine-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-sh-fdev-runtime-client-*.tgz --access public --dry-run
          npx npm@latest publish "dist/npm/freestyle-sh-fdev-${version}.tgz" --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-sh-fdev-provider-freestyle-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-sh-fdev-provider-gcloud-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-sh-fdev-cmux-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-sh-fdev-vscode-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-sh-fdev-cli-*.tgz --access public --dry-run

      - name: Publish packages
        if: steps.bootstrap.outputs.published == 'true'
        run: |
          version="$(bun -p 'require("./packages/fdev/package.json").version')"
          npx npm@latest publish dist/npm/freestyle-sh-fdev-engine-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-sh-fdev-runtime-client-*.tgz --access public
          npx npm@latest publish "dist/npm/freestyle-sh-fdev-${version}.tgz" --access public
          npx npm@latest publish dist/npm/freestyle-sh-fdev-provider-freestyle-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-sh-fdev-provider-gcloud-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-sh-fdev-cmux-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-sh-fdev-vscode-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-sh-fdev-cli-*.tgz --access public
