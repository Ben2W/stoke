name: Canary npm Packages

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: canary-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/rigkit canary') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      ref_name: ${{ steps.pr.outputs.ref_name }}
      version: ${{ steps.canary.outputs.version }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Verify command permissions
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write)
              ;;
            *)
              echo "${ACTOR} must have write access to publish canaries" >&2
              exit 1
              ;;
          esac

      - name: Read PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --json headRefOid,headRefName,headRepositoryOwner,headRepository)"
          sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          ref_name="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
          owner="$(printf '%s' "$pr_json" | jq -r '.headRepositoryOwner.login')"
          repo="$(printf '%s' "$pr_json" | jq -r '.headRepository.name')"

          if [ "${owner}/${repo}" != "$REPOSITORY" ]; then
            echo "Canary publishing is only allowed for branches in ${REPOSITORY}" >&2
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute canary version
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release/canary-version.ts \
            --pr "${{ github.event.issue.number }}" \
            --sha "${{ steps.pr.outputs.sha }}"

  publish:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      dist-tag: pr-${{ needs.prepare.outputs.pr_number }}
      ref: ${{ needs.prepare.outputs.sha }}
      allow-unpublished: true
      skip-release-branch: true

  comment:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment with canary version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "Published Rigkit canary packages at version ${VERSION} with npm dist-tag pr-${PR_NUMBER}."
