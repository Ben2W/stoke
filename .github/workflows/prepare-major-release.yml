name: Prepare Major Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare major release 1.0.0 from main"
        required: true
        type: choice
        options:
          - "1.0.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    concurrency:
      group: prepare-major-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare major release
        uses: ./.github/actions/prepare-release
        with:
          release-type: major
          release-version: ${{ inputs.version }}
          github-token: ${{ github.token }}
