name: Prepare Release Internal

on:
  workflow_call:
    inputs:
      release_type:
        description: "patch, minor, or major"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ inputs.release_type }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan release
        id: plan
        run: pnpm release:plan -- --release-type "${{ inputs.release_type }}"

      - name: Create release branch
        if: steps.plan.outputs.create_release_branch == 'true'
        env:
          TARGET_BRANCH: ${{ steps.plan.outputs.target_branch }}
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          head_sha="$(git rev-parse HEAD)"

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$head_sha" ]; then
              echo "${TARGET_BRANCH} already exists at ${remote_sha}, expected ${head_sha}." >&2
              echo "Use Prepare Patch Release from that branch, or delete/recreate the branch intentionally." >&2
              exit 1
            fi

            echo "${TARGET_BRANCH} already exists at the current commit; reusing it."
            exit 0
          fi

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Create automation branch
        id: branch
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          branch="automation/release-v${VERSION}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Apply version bump
        run: pnpm release:bump -- "${{ steps.plan.outputs.version }}"

      - name: Validate release
        run: pnpm release:preflight

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No release changes were generated" >&2
            exit 1
          fi

          git add .
          git commit -m "Prepare Rigkit v${{ steps.plan.outputs.version }}"
          git push --set-upstream origin "${{ steps.branch.outputs.branch }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.plan.outputs.target_branch }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TYPE: ${{ steps.plan.outputs.release_type }}
          CURRENT_VERSION: ${{ steps.plan.outputs.current_version }}
        run: |
          body="$RUNNER_TEMP/release-pr.md"
          {
            echo "Prepares Rigkit v${VERSION}."
            echo ""
            echo "- Current version: ${CURRENT_VERSION}"
            echo "- Target branch: ${TARGET_BRANCH}"
            echo "- Release type: ${RELEASE_TYPE}"
            echo ""
            echo "Merging this PR will create tag v${VERSION}. The tag will trigger npm publishing and the CLI release."
          } > "$body"

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Release Rigkit v${VERSION}" \
            --body-file "$body"
