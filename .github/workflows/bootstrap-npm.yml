name: Bootstrap npm Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.3"
        required: true

permissions:
  contents: read

jobs:
  bootstrap-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Setup npm auth
        run: |
          if [ -z "${NPM_BOOTSTRAP_TOKEN:-}" ]; then
            echo "Missing NPM_BOOTSTRAP_TOKEN secret" >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_BOOTSTRAP_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release versions
        env:
          GITHUB_REF_NAME: ${{ inputs.tag }}
        run: pnpm release:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify packages are not already published
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in @freestyle/fdev-sdk @freestyle/fdev-engine @freestyle/fdev-cli; do
            if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
              echo "${pkg}@${version} is already published" >&2
              exit 1
            fi
          done
        env:
          GITHUB_REF_NAME: ${{ inputs.tag }}

      - name: Pack packages
        run: |
          mkdir -p dist/npm
          pnpm -C packages/fdev-sdk pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-engine pack --pack-destination ../../dist/npm
          pnpm -C packages/fdev-cli pack --pack-destination ../../dist/npm

      - name: Dry run package publish
        run: |
          npx npm@latest publish dist/npm/freestyle-fdev-sdk-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-fdev-engine-*.tgz --access public --dry-run
          npx npm@latest publish dist/npm/freestyle-fdev-cli-*.tgz --access public --dry-run

      - name: Publish packages
        run: |
          npx npm@latest publish dist/npm/freestyle-fdev-sdk-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-fdev-engine-*.tgz --access public
          npx npm@latest publish dist/npm/freestyle-fdev-cli-*.tgz --access public
