name: Bootstrap npm Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.10"
        required: true

permissions:
  contents: read

concurrency:
  group: bootstrap-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  bootstrap-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Setup npm auth
        run: |
          if [ -z "${NPM_BOOTSTRAP_TOKEN:-}" ]; then
            echo "Missing NPM_BOOTSTRAP_TOKEN secret" >&2
            exit 1
          fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          mkdir -p "$(dirname "$npmrc")"
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NPM_BOOTSTRAP_TOKEN}"
          } > "$npmrc"
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Verify npm auth
        run: npm whoami

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        run: pnpm release:preflight -- --tag "${{ inputs.tag }}" --allow-unpublished

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack packages
        run: pnpm release:pack

      - name: Dry run package publish
        run: pnpm release:publish -- --dry-run

      - name: Publish packages
        run: pnpm release:publish

      - name: Print trusted publishing commands
        if: always()
        run: pnpm release:trust-commands
